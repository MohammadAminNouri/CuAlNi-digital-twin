name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev-core.txt
      - run: python -m pip check
      - run: python -m ruff check --select E9,F63,F7,F82 app.py src tests
      - run: python -m pytest --cov=src --cov-report=term-missing
      - run: python -m compileall -q app.py src
      - run: python scripts/smoke_server.py
      - name: Verify installed package outside the source tree
        run: |
          python -m pip install . --no-deps
          cd "${{ runner.temp }}"
          python -c "from application.analysis_service import AnalysisInputs, run_complete_analysis; result = run_complete_analysis(AnalysisInputs({'Cu': 81.4, 'Al': 14.3, 'Ni': 4.3})); assert result['composition']['status'] == 'available', result['composition']"

  scientific:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Verify optional engines are actually installed
        run: python -c "import pycalphad, scheil, pymatgen, spglib, ase, xgboost, lightgbm, shap"
      - run: python -m pytest
