[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cualni-digitaltwin-pro"
version = "1.0.0"
description = "Provenance-aware Cu-Al-Ni computational alloy design and characterization platform"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {text = "MIT"}
authors = [{name = "CuAlNi-DigitalTwin Pro contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.4,<2",
  "plotly>=5.20,<7",
  "streamlit>=1.63,<2",
  "Jinja2>=3.1,<4",
  "reportlab>=4,<5",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
calphad = ["pycalphad>=0.11,<0.12", "scheil>=0.2,<0.4"]
crystal = ["pymatgen>=2024.5.1", "spglib>=2.4,<3", "ase>=3.23,<4"]
boosted = ["xgboost>=2,<4", "lightgbm>=4,<5", "shap>=0.45,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = ["streamlit: Streamlit AppTest smoke tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
